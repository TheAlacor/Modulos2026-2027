<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Biblioteca de Libros</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .grid-libros {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    .tarjeta-libro {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      width: 200px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .tarjeta-libro img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 4px;
    }
    .tarjeta-libro h3 {
      font-size: 1.1em;
      margin: 10px 0 5px 0;
    }
    .tarjeta-libro p {
      color: #666;
      font-size: 0.9em;
      margin: 0;
    }
  </style>
</head>
<body>

  <h1>Mis Libros</h1>
  <div id="contenedor-libros" class="grid-libros">
    <p>Cargando libros...</p>
  </div>

<script type="module">
    // Importar las funciones necesarias de los SDKs de Firebase vía CDN
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
    import { 
        getAuth, 
        createUserWithEmailAndPassword, 
        signInWithEmailAndPassword, 
        signOut, 
        onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
        getFirestore, 
        collection, 
        addDoc,
        getDocs,
        onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Configuración de tu app con tus datos reales
    const firebaseConfig = {
        apiKey: "AIzaSyCRF2v7tEHIu33LzjYDdIZ3J7j-oQQDwhE",
        authDomain: "miappfirebase-32cec.firebaseapp.com",
        projectId: "miappfirebase-32cec",
        storageBucket: "miappfirebase-32cec.firebasestorage.app",
        messagingSenderId: "46185664256",
        appId: "1:46185664256:web:99a7285e31fbb2f36fade5",
        measurementId: "G-WCQWV09B59"
    };

    // 1. Inicializar Firebase y Firestore
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // 2. Elemento contenedor en tu HTML
    const contenedor = document.getElementById('contenedor-libros');

    // 3. Función para obtener los libros una sola vez al cargar la página
    async function cargarLibros() {
      try {
        const querySnapshot = await getDocs(collection(db, "Libros"));
        
        if (contenedor) {
          contenedor.innerHTML = "";

          if (querySnapshot.empty) {
            contenedor.innerHTML = "<p>No hay libros registrados.</p>";
            return;
          }

          querySnapshot.forEach((doc) => {
            const libro = doc.data();

            // Crear tarjeta para cada libro
            const tarjeta = document.createElement('div');
            tarjeta.className = 'tarjeta-libro';

            tarjeta.innerHTML = `
              <img src="${libro.Portada}" alt="Portada de ${libro.titulo}" style="width: 150px; height: 220px; object-fit: cover;">
              <h3>${libro.titulo}</h3>
              <p><strong>Autor:</strong> ${libro.Autor}</p>
            `;

            contenedor.appendChild(tarjeta);
          });
        }
      } catch (error) {
        console.error("Error obteniendo los libros:", error);
        if (contenedor) {
          contenedor.innerHTML = "<p>Error al cargar los libros.</p>";
        }
      }
    }

    // Ejecutar la función
    cargarLibros();
</script>
